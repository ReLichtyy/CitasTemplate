# Puerta unica del contenedor: sirve el frontend compilado y manda /api al API.
#
# Reemplaza el nginx.conf de la distribucion entero (no incluye sites-enabled) para que
# la configuracion efectiva sea exactamente esta, sin depender de que traiga la base.
#
# El `user` no se declara a proposito: cada base trae el suyo compilado (www-data en
# Debian, nginx en Alpine) y fijarlo aqui rompe la que no coincida.

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log al stdout del contenedor: los logs los junta Docker, no el disco de la imagen.
    log_format principal '$remote_addr $request_method $uri $status ${request_time}s';
    access_log /dev/stdout principal;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Una conexion del navegador sirve varias peticiones: el frontend pide index.html,
    # su bundle y varias llamadas al API seguidas, y cada handshake nuevo es latencia.
    keepalive_timeout  65;
    keepalive_requests 1000;

    client_max_body_size 1m;   # el API corta en 64 kb; esto solo evita subir el cuerpo entero para rechazarlo
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Los estaticos de Vite no cambian nunca sin cambiar de nombre: cachear el descriptor
    # de archivo evita un stat por peticion.
    open_file_cache          max=2000 inactive=5m;
    open_file_cache_valid    2m;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/javascript text/css
                      text/plain image/svg+xml application/manifest+json;

    # El API corre en el mismo contenedor. `keepalive` mantiene abiertas las conexiones
    # hacia el: sin esto nginx abre un socket nuevo por peticion.
    upstream api {
        server 127.0.0.1:8080;
        keepalive 32;
        keepalive_timeout 60s;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /srv/citas/web;
        index index.html;

        # --- API -----------------------------------------------------------
        # La barra final del proxy_pass es la que quita el prefijo /api: el frontend
        # pide /api/citas y el API recibe /citas. Es el mismo contrato que en local,
        # donde VITE_API_URL apunta a la raiz del API.
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            # Respuestas JSON chicas: acumularlas en disco solo agrega latencia.
            proxy_buffering off;
        }

        # Sonda del contenedor y de cualquier balanceador de arriba.
        location = /health {
            proxy_pass http://api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # El webhook de WAHA viaja por loopback dentro del contenedor. Desde fuera no
        # tiene ningun caso de uso legitimo: la ruta es publica por fuerza (la firma HMAC
        # es lo unico que la protege) y no hace falta darle una superficie mas.
        location /webhooks/ {
            return 404;
        }

        # --- Frontend ------------------------------------------------------
        # Vite pone el hash del contenido en el nombre: el archivo con un nombre dado
        # nunca cambia, asi que se puede cachear para siempre.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # El index es el que apunta a los bundles nuevos tras un despliegue: si se cachea,
        # el navegador sigue pidiendo los viejos, que ya no existen.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # React Router resuelve las rutas en el cliente: cualquier URL desconocida
        # devuelve el index, no un 404 de nginx.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
