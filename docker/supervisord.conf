; Tres procesos en un contenedor: WAHA, el API (que lleva dentro el worker de
; notificaciones) y nginx. supervisor esta aqui para una sola cosa: que la caida de uno
; lo levante de nuevo sin tirar a los otros dos.
;
; Los logs van todos al stdout del contenedor. Escribirlos a archivos dentro de la
; imagen es llenar el disco del VPS con algo que `docker logs` ya sabe rotar.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- WAHA -------------------------------------------------------------------
; Arranca primero: recupera sus sesiones desde /app/.sessions y eso tarda. El API no lo
; espera (sin canal, el worker deja la fila en la cola y reintenta), asi que el arranque
; no se serializa.
;
; autostart sale del entorno: un despliegue sin WhatsApp pone WAHA_AUTOSTART=false y el
; resto de la imagen funciona igual, con el gateway que escribe al log.
[program:waha]
command=/usr/local/bin/waha-run
directory=/app
environment=PORT="%(ENV_WAHA_PORT)s",NODE_ENV="production"
autostart=%(ENV_WAHA_AUTOSTART)s
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- API + worker de notificaciones -----------------------------------------
[program:api]
command=node dist/main.js
directory=/srv/citas/api
environment=PORT="%(ENV_API_PORT)s",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --- nginx ------------------------------------------------------------------
; `daemon off` es obligatorio: si nginx se va al fondo, supervisor cree que murio y lo
; arranca en bucle.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=20
; QUIT es el apagado elegante de nginx: termina las peticiones en curso antes de salir.
stopsignal=QUIT
stopwaitsecs=15
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
